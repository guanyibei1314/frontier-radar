name: Ingest Pipeline

on:
  schedule:
    - cron: '0 */3 * * *'  # Every 3 hours, UTC
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: cd pipeline && python main.py

      - name: Build frontend
        run: |
          cd web
          npm ci
          rm -rf public/data
          cp -r ../data public/data
          npm run build

      - name: Commit data
        run: |
          git config user.name "frontier-radar[bot]"
          git config user.email "bot@frontier-radar.local"
          git add data/ pipeline/cache/
          git diff --staged --quiet || git commit -m "chore: update data [$(date -u +%Y-%m-%dT%H:%M)]"
          git push
