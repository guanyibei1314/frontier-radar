name: Bootstrap Web Audit Fix

on:
  push:
    branches: [maintenance/web-audit-fix]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/web-audit-fix
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply non-breaking audit fix
        working-directory: web
        run: npm audit fix --package-lock-only
      - name: Verify install and build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Require zero high/critical audit findings
        working-directory: web
        run: npm audit --audit-level=high
      - name: Commit verified lockfile update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile changes to commit.'
            exit 0
          fi
          git commit -m 'fix: update web dependency lockfile'
          git push origin HEAD:maintenance/web-audit-fix
