name: Bootstrap Web Audit Fix

on:
  push:
    branches: [maintenance/web-audit-fix]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/web-audit-fix
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Resolve coordinated safe web dependency set
        working-directory: web
        run: npm install react-router-dom@latest vite@latest @vitejs/plugin-react@latest
      - name: Verify clean install and production build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Require zero high/critical audit findings
        working-directory: web
        run: npm audit --audit-level=high
      - name: Commit verified dependency update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package.json web/package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git commit -m 'fix: upgrade web dependencies past security advisories'
          git push origin HEAD:maintenance/web-audit-fix
